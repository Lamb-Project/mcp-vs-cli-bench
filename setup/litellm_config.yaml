# LiteLLM proxy: every scaffolding -> here -> OpenAI or a local server.
#
# Two reasons the proxy is in the path rather than pointing scaffoldings straight
# at the provider:
#
# 1. Sub-agents. A scaffolding that delegates work bills its children to separate
#    threads whose tokens never appear in the parent's usage record. Those child
#    requests still cross this proxy, so proxying is what makes the token totals
#    complete rather than merely flagged as incomplete.
# 2. A hard spending ceiling. max_budget is enforced upstream of the harness, so
#    a looping agent cannot outspend the budget even if the harness mis-estimates.
#
# The proxy adds no tokens of its own, so routing through it is measurement-neutral.

model_list:
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: http://localhost:8000/v1
      api_key: local
  - model_name: qwen3.5:122b
    litellm_params:
      model: openai/qwen3.5:122b
      api_base: http://192.168.1.47:11434/v1
      api_key: local
  - model_name: qwen3.6:27b
    litellm_params:
      model: openai/qwen3.6:27b
      api_base: http://192.168.1.47:11434/v1
      api_key: local
  - model_name: gpt-5.6-sol
    litellm_params: {model: openai/gpt-5.6-sol, api_key: os.environ/OPENAI_API_KEY, reasoning_effort: minimal}
  - model_name: gpt-5.6-luna
    litellm_params: {model: openai/gpt-5.6-luna, api_key: os.environ/OPENAI_API_KEY, reasoning_effort: minimal}
  - model_name: gpt-5.6-terra
    litellm_params: {model: openai/gpt-5.6-terra, api_key: os.environ/OPENAI_API_KEY, reasoning_effort: minimal}
  - model_name: gpt-5.2
    litellm_params: {model: openai/gpt-5.2, api_key: os.environ/OPENAI_API_KEY, reasoning_effort: minimal}
  - model_name: gpt-5.1
    litellm_params: {model: openai/gpt-5.1, api_key: os.environ/OPENAI_API_KEY, reasoning_effort: minimal}
  - model_name: gpt-5-mini
    litellm_params: {model: openai/gpt-5-mini, api_key: os.environ/OPENAI_API_KEY, reasoning_effort: minimal}

litellm_settings:
  callbacks: usage_logger.handler
  # NOTE: litellm's max_budget requires a database backend; without one every
  # request fails with "400 No connected db". The ceiling is enforced in the
  # harness instead (bench/budget.py), which needs no external service.
  drop_params: true          # scaffoldings send provider-specific extras

general_settings:
  master_key: sk-e1-local
